<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Aloha! Invitación Galilea</title>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --purple: #a855f7; --pink: #f472b6; --bg: #fff0f6; }
        body { font-family: 'Quicksand', sans-serif; margin: 0; background: var(--bg); text-align: center; color: #4b2e2e; }
        .header { background: linear-gradient(180deg, #c084fc 0%, #f472b6 100%); color: white; padding: 50px 20px 80px; position: relative; }
        .title { font-family: 'Lobster', cursive; font-size: 3.5rem; margin: 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
        .name { font-family: 'Lobster', cursive; font-size: 4.2rem; margin: 10px 0; line-height: 1; }
        .photo-circle { width: 210px; height: 210px; margin: 20px auto; border-radius: 50%; border: 6px solid white; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .photo-circle img { width: 100%; height: 100%; object-fit: cover; }
        .card { background: white; max-width: 500px; margin: -40px auto 30px; padding: 30px; border-radius: 25px; border: 2px dashed #f9a8d4; box-shadow: 0 10px 25px rgba(0,0,0,0.05); position: relative; z-index: 2; width: 85%; }
        .btn { display: block; width: 100%; padding: 16px; background: linear-gradient(90deg, #f472b6, #c084fc); color: white; text-decoration: none; border-radius: 50px; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; font-size: 1.1rem; box-shadow: 0 4px 10px rgba(244, 114, 182, 0.3); }
        .input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; font-size: 1rem; }
        #audioBtn { position: fixed; bottom: 20px; right: 20px; background: #222; color: white; padding: 12px 22px; border-radius: 50px; cursor: pointer; z-index: 1000; border: 2px solid white; font-weight: bold; }
    </style>
</head>
<body>

    <audio id="musicaFondo" loop>
        <source src="musica.mp3.mpeg" type="audio/mpeg">
    </audio>

    <div class="header">
        <h1 class="title">¡Aloha!</h1>
        <p style="letter-spacing: 2px; font-weight: 700;">TE ESPERAMOS EN EL CUMPLE DE</p>
        <h1 class="name">Galilea Ramos</h1>
        <div class="photo-circle">
            <img src="gali.png.png" alt="Galilea">
        </div>
    </div>

    <div class="card">
        <h3 style="color: var(--purple); margin-top: 0;">🌺 ¡Celebremos juntos!</h3>
        <p style="font-size: 1.1rem; margin: 10px 0;">📅 <b>Sábado 28 de Marzo</b></p>
        <p style="font-size: 1.1rem; margin: 10px 0;">⏰ <b>1:30 PM</b></p>
        <p style="font-size: 1.1rem; margin: 10px 0;">📍 <b>Nuestra casita, Acajutla</b></p>
        <p style="font-size: 0.9rem; color: #777;">Temática: Lilo & Stitch</p>
        <a href="https://maps.google.com" target="_blank" class="btn" style="background: var(--purple)">Ver Ubicación en Mapa 🗺️</a>
    </div>

    <div class="card">
        <h3 style="color: var(--pink); margin-top: 0;">✍️ Confirma tu asistencia</h3>
        <input type="text" id="nombre" placeholder="Escribe tu nombre aquí..." class="input">
        <button onclick="confirmarWA()" class="btn">Confirmar por WhatsApp 💬</button>
    </div>

    <div id="audioBtn">🎶 Música OFF</div>

    <script>
        const audio = document.getElementById('musicaFondo');
        const btn = document.getElementById('audioBtn');
        let iniciado = false;

        function confirmarWA() {
            const nom = document.getElementById('nombre').value;
            if(!nom) { alert("Por favor, dinos quién eres para anotarte 🌸"); return; }
            const texto = encodeURIComponent(¡Aloha! Soy ${nom}. Confirmo mi asistencia al cumple de Gali. ¡Nos vemos pronto! 🌺✨);
            window.open(https://wa.me/50377426707?text=${texto}, '_blank');
        }

        // Inicia música al primer toque en la pantalla
        document.addEventListener('click', () => {
            if(!iniciado) {
                audio.play().then(() => { 
                    btn.innerHTML = "🔊 Música ON"; 
                    iniciado = true; 
                }).catch(e => console.log("Audio pendiente"));
            }
        }, { once: true });

        // Control manual del botón
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (audio.paused) { 
                audio.play(); 
                btn.innerHTML = "🔊 Música ON"; 
            } else { 
                audio.pause(); 
                btn.innerHTML = "🔇 Música OFF"; 
            }
        });
    </script>
</body>
</html>
