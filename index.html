<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Aloha! Invitacion Cumpleaños de GALILEA RAMOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- TUS VARIABLES ORIGINALES --- */
        :root {
              --blue-header: #a855f7;
              --blue-light: #d8b4fe;
              --coral: #f472b6;
              --text-dark: #4b2e2e;
              --card-border: #f9a8d4;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            margin: 0; padding: 0;
            color: var(--text-dark);
            background-color: #fff0f6;
            background-image: url('fondo-patron.png'); 
            background-size: 300px; 
            background-repeat: repeat;
            position: relative;
            overflow-x: hidden; 
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.85); 
            z-index: -1;
        }

        .main-header {
            background: linear-gradient(180deg, #c084fc 0%, #f472b6 100%);
            color: white;
            text-align: center;
            padding-top: 40px;
            position: relative;
            padding-bottom: 120px; 
        }

        .header-content {
            position: relative;
            z-index: 3;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .main-title { font-family: 'Lobster', cursive; font-size: 3.5em; margin: 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .sub-title { font-weight: 700; margin: 10px 0 5px 0; font-size: 1.2em; letter-spacing: 2px; text-transform: uppercase; }
        .name-title { font-family: 'Lobster', cursive; font-size: 4em; margin: 0; line-height: 1.1; text-shadow: 3px 3px 0px rgba(0,0,0,0.1); }
        .subtitle-text { font-weight: 600; letter-spacing: 1px; margin-bottom: 30px; opacity: 0.9; }

        .photo-wrapper {
            width: 200px; height: 200px;
            margin: 20px auto;
            border-radius: 50%;
            border: 5px solid white;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .profile-pic { width: 100%; height: 100%; object-fit: cover; }

        .cards-container {
            max-width: 1000px;
            margin: -60px auto 50px auto; 
            padding: 20px;
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr; 
            gap: 25px;
        }

        .card {
            background: #fff7fb;
            border-radius: 25px;
            border: 2px dashed var(--card-border); 
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: left;
        }

        .card-title {
            color: var(--blue-header);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .btn {
            display: block; width: 100%; padding: 15px;
            background: linear-gradient(90deg, #f472b6, #c084fc);
            color: white; text-decoration: none;
            border-radius: 50px; font-weight: bold;
            margin-top: 10px; text-align: center; border: none;
            box-sizing: border-box; transition: transform 0.2s;
        }

        #audioControls {
            position: fixed; bottom: 20px; right: 20px;
            background: #222; color: white;
            padding: 12px 25px; border-radius: 50px;
            cursor: pointer; z-index: 1000;
            border: 2px solid white;
            display: flex; align-items: center; gap: 10px;
        }

        @media (min-width: 768px) {
            .cards-container { grid-template-columns: 1.2fr 1fr; }
        }
    </style>
</head>
<body>

    <audio id="fiestaAudio" loop>
        <source src="musica.mp3.mpeg" type="audio/mpeg">
    </audio>

    <header class="main-header">
        <div class="header-content">
            <h1 class="main-title">Aloha!</h1>
            <h2 class="sub-title">¡CUMPLEAÑOS DE!</h2>
            <h1 class="name-title">Galilea Ramos</h1>
            <p class="subtitle-text">CELEBRAMOS 4 AÑOS</p>
            <div class="photo-section">
                <div class="photo-wrapper">
                    <img src="GALI.png.png" alt="gali" class="profile-pic">
                </div>
            </div>
        </div>
    </header>

    <main class="cards-container">
        <section class="card details-card">
            <h3 class="card-title">🌺 Detalles del Evento</h3>
            <ul style="list-style:none; padding:0;">
                <li><strong>📅 Fecha:</strong> Sábado 28 de marzo</li>
                <li><strong>⏰ Hora:</strong> 1:30 PM</li>
                <li><strong>🏖️ Lugar:</strong> Nuestra casita, Acajutla</li>
            </ul>
        </section>

        <div class="right-column" style="display:flex; flex-direction:column; gap:25px;">
            <section class="card">
                <h3 class="card-title">📍 Ubicación</h3>
                <a href="https://maps.app.goo.gl/W7rz8CH95HfYZyyNA?g_st=ic" target="_blank" class="btn" style="background-color: var(--blue-header);">Ver en Google Maps 🗺️</a>
            </section>

            <section class="card">
                <h3 class="card-title">✍️ Confirmar Asistencia</h3>
                <input type="text" id="guestName" placeholder="Tu Nombre" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ccc; box-sizing:border-box;">
                <button onclick="sendToWhatsapp()" class="btn">Confirmar por WhatsApp 💬</button>
            </section>
        </div>
    </main>

    <div id="audioControls"><span>🎶</span> Musicon OFF</div>

    <script>
        // TU FUNCIÓN DE WHATSAPP ORIGINAL (Solo corregí tu número)
        function sendToWhatsapp() {
            const name = document.getElementById('guestName').value;
            if(name.trim() === "") { alert("🌺 ¡Por favor escribe tu nombre!"); return; }
            const message = ¡Aloha! 🌺 Soy *${name}*. Quiero confirmar mi asistencia al cumple de Gali. ¡Nos vemos ahí!;
            const url = https://wa.me/50377426707?text=${encodeURIComponent(message)};
            window.open(url, '_blank');
        }

        const audio = document.getElementById('fiestaAudio');
        const btn = document.getElementById('audioControls');
        let isPlaying = false;

        // ESTO ES LO ÚNICO QUE AGREGUÉ PARA QUE EL BOTÓN FUNCIONE
        btn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                isPlaying = true;
                btn.innerHTML = '<span>🔊</span> Musicon ON';
            } else {
                audio.pause();
                isPlaying = false;
                btn.innerHTML = '<span>🔇</span> Musicon OFF';
            }
        });
    </script>
</body>
</html>
